<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Морской бой — головоломка</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#f5e6c8;color:#3a2a1a}
body{display:flex;flex-direction:column;align-items:center;padding:12px 8px}
.header{width:100%;max-width:420px;text-align:center;margin-bottom:8px}
.title{font-size:18px;font-weight:600;color:#5a3a1a}
.subtitle{font-size:12px;color:#8b6f47;margin-top:4px}
.legend{display:flex;gap:12px;justify-content:center;margin:8px 0;font-size:11px}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-box{width:18px;height:18px;border:1px solid #8b6f47;border-radius:3px}
.legend-box.empty{background:#f5e6c8}
.legend-box.water{background:#a8c8d8}
.legend-box.ship{background:#5a3a1a}
.board-wrap{display:flex;flex-direction:column;align-items:center}
.top-labels{display:grid;grid-template-columns:30px repeat(6,50px);margin-bottom:4px}
.top-label{width:50px;height:24px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#5a3a1a}
.top-label.empty{width:30px}
.board-row{display:flex;align-items:center}
.left-label{width:30px;height:50px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#5a3a1a}
.cell{width:50px;height:50px;border:1.5px solid #8b6f47;background:#f5e6c8;cursor:pointer;transition:background 0.15s;display:flex;align-items:center;justify-content:center;font-size:20px;user-select:none}
.cell:active{background:#e8d4a8}
.cell.water{background:#a8c8d8}
.cell.water::after{content:'~';color:#5a7a8a;font-size:24px}
.cell.ship{background:#5a3a1a}
.cell.ship::after{content:'●';color:#f5e6c8;font-size:24px}
.cell.error{background:#d85a5a;animation:shake 0.3s}
.cell.hint{background:#c8e8a8}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.controls{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{background:#e8d4a8;border:1.5px solid #8b6f47;color:#3a2a1a;padding:10px 16px;border-radius:6px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer}
.btn:active{background:#d4b888}
.btn.primary{background:#8b6f47;color:#f5e6c8}
.status{margin-top:12px;font-size:13px;color:#5a3a1a;min-height:20px;text-align:center}
.ships-info{margin-top:8px;font-size:11px;color:#8b6f47;text-align:center}
.fleet-info{margin-top:4px;font-size:11px;color:#8b6f47;text-align:center}
</style>
</head>
<body>
<div class="header">
  <div class="title">Морской бой</div>
  <div class="subtitle">Расставьте флот по подсказкам</div>
</div>
<div class="legend">
  <div class="legend-item"><div class="legend-box empty"></div>Пусто</div>
  <div class="legend-item"><div class="legend-box water"></div>Вода</div>
  <div class="legend-item"><div class="legend-box ship"></div>Корабль</div>
</div>
<div class="board-wrap">
  <div class="top-labels" id="topLabels"></div>
  <div id="board"></div>
</div>
<div class="fleet-info">Флот: 1 линкор (3), 2 крейсера (2), 3 катера (1)</div>
<div class="ships-info" id="shipsInfo">Кораблей: 0/10</div>
<div class="controls">
  <button class="btn primary" id="btnCheck">Проверить</button>
  <button class="btn" id="btnReset">Сброс</button>
  <button class="btn" id="btnNew">Новая игра</button>
</div>
<div class="status" id="status">Нажмите на клетку для изменения</div>

<script>
const SIZE=6;
const SHIPS=[3,2,2,1,1,1];
const TOTAL_CELLS=SHIPS.reduce((a,b)=>a+b,0);
let solution=[];
let board=[];
let rowHints=[];
let colHints=[];

function emptyBoard(){return Array.from({length:SIZE},()=>Array(SIZE).fill(0));}

// Проверяет, можно ли разместить корабль длиной len, начиная с (r,c)
// Корабли НЕ могут касаться друг друга ни бортами, ни углами
function canPlace(b,r,c,len,horizontal){
  // Собираем все клетки корабля
  const cells=[];
  for(let i=0;i<len;i++){
    const rr=horizontal?r:r+i;
    const cc=horizontal?c+i:c;
    if(rr>=SIZE||cc>=SIZE)return false;
    if(b[rr][cc]!==0)return false;
    cells.push([rr,cc]);
  }
  // Проверяем, что вокруг корабля (включая диагонали) нет других кораблей
  for(const [rr,cc] of cells){
    for(let dr=-1;dr<=1;dr++){
      for(let dc=-1;dc<=1;dc++){
        if(dr===0&&dc===0)continue;
        const nr=rr+dr,nc=cc+dc;
        if(nr>=0&&nr<SIZE&&nc>=0&&nc<SIZE&&b[nr][nc]!==0){
          // Проверяем, что это не соседняя клетка того же корабля
          const isSameShip=cells.some(([cr,cc2])=>cr===nr&&cc2===nc);
          if(!isSameShip)return false;
        }
      }
    }
  }
  return true;
}

function placeShip(b,r,c,len,horizontal){
  for(let i=0;i<len;i++){
    const rr=horizontal?r:r+i;
    const cc=horizontal?c+i:c;
    b[rr][cc]=1;
  }
}

// Backtracking-генератор для гарантированного нахождения решения
function generateSolution(){
  const b=emptyBoard();
  const ships=[...SHIPS].sort(()=>Math.random()-0.5); // перемешиваем порядок
  return placeShips(b,ships,0);
}

function placeShips(b,ships,idx){
  if(idx===ships.length)return b;
  const len=ships[idx];
  // Пробуем все возможные позиции
  const positions=[];
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      for(const horizontal of [true,false]){
        if(canPlace(b,r,c,len,horizontal)){
          positions.push([r,c,horizontal]);
        }
      }
    }
  }
  // Перемешиваем позиции для случайности
  for(let i=positions.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [positions[i],positions[j]]=[positions[j],positions[i]];
  }
  for(const [r,c,horizontal] of positions){
    placeShip(b,r,c,len,horizontal);
    const result=placeShips(b,ships,idx+1);
    if(result)return result;
    // Откат
    for(let i=0;i<len;i++){
      const rr=horizontal?r:r+i;
      const cc=horizontal?c+i:c;
      b[rr][cc]=0;
    }
  }
  return null;
}

function computeHints(b){
  const rh=Array(SIZE).fill(0);
  const ch=Array(SIZE).fill(0);
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      if(b[r][c]===1){rh[r]++;ch[c]++;}
    }
  }
  return{rh,ch};
}

function newGame(){
  let attempts=0;
  while(attempts<100){
    attempts++;
    solution=generateSolution();
    if(solution){
      board=emptyBoard();
      const h=computeHints(solution);
      rowHints=h.rh;
      colHints=h.ch;
      render();
      document.getElementById('status').textContent='Новая расстановка. Удачи!';
      return;
    }
  }
  document.getElementById('status').textContent='Ошибка генерации. Попробуйте ещё раз.';
}

function render(){
  const topLabels=document.getElementById('topLabels');
  const boardEl=document.getElementById('board');
  topLabels.innerHTML='<div class="top-label empty"></div>';
  colHints.forEach(h=>{topLabels.innerHTML+=`<div class="top-label">${h}</div>`;});
  boardEl.innerHTML='';
  for(let r=0;r<SIZE;r++){
    const row=document.createElement('div');
    row.className='board-row';
    row.innerHTML=`<div class="left-label">${rowHints[r]}</div>`;
    for(let c=0;c<SIZE;c++){
      const cell=document.createElement('div');
      cell.className='cell';
      if(board[r][c]===1)cell.classList.add('water');
      if(board[r][c]===2)cell.classList.add('ship');
      cell.addEventListener('click',()=>toggleCell(r,c));
      row.appendChild(cell);
    }
    boardEl.appendChild(row);
  }
  updateInfo();
}

function toggleCell(r,c){
  board[r][c]=(board[r][c]+1)%3;
  render();
  document.getElementById('status').textContent='Нажмите на клетку для изменения';
}

function updateInfo(){
  let ships=0;
  for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(board[r][c]===2)ships++;
  document.getElementById('shipsInfo').textContent=`Кораблей: ${ships}/${TOTAL_CELLS}`;
}

function check(){
  let correct=true;
  let ships=0;
  for(let r=0;r<SIZE;r++){
    let rowSum=0;
    for(let c=0;c<SIZE;c++){
      if(board[r][c]===2)rowSum++;
      if(board[r][c]!==solution[r][c])correct=false;
    }
    if(rowSum!==rowHints[r])correct=false;
  }
  for(let c=0;c<SIZE;c++){
    let colSum=0;
    for(let r=0;r<SIZE;r++)if(board[r][c]===2)colSum++;
    if(colSum!==colHints[c])correct=false;
  }
  const cells=document.querySelectorAll('.cell');
  let idx=0;
  for(let r=0;r<SIZE;r++){
    for(let c=0;c<SIZE;c++){
      if(board[r][c]===2&&solution[r][c]!==2)cells[idx].classList.add('error');
      if(board[r][c]===0&&solution[r][c]===1)cells[idx].classList.add('hint');
      idx++;
    }
  }
  document.getElementById('status').textContent=correct?'✓ Всё верно! Флот расставлен правильно':'✗ Есть ошибки. Красные — лишние, зелёные — пропущенные';
  setTimeout(()=>{document.querySelectorAll('.cell').forEach(c=>c.classList.remove('error','hint'));},2000);
}

function reset(){
  board=emptyBoard();
  render();
  document.getElementById('status').textContent='Поле очищено';
}

document.getElementById('btnCheck').addEventListener('click',check);
document.getElementById('btnReset').addEventListener('click',reset);
document.getElementById('btnNew').addEventListener('click',newGame);
newGame();
</script>
</body>
</html>
