<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4efe3">
<title>2048 · «МаТема»</title>
<style>
  :root{
    --bg:#f1e9d8;
    --bg2:#f7f1e2;
    --board:#e6dcc6;
    --cell:#f6efdf;
    --ink:#332c24;
    --soft:#6d6455;
    --line:#d9cdb4;
    --accent:#b06a24;
    --gap:2.6%;
    --radius:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 80% at 50% -10%, #fdf8ec 0%, var(--bg2) 38%, var(--bg) 100%);
    color:var(--ink);
    font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow:hidden;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  .app{
    width:100%;
    max-width:460px;
    padding:calc(10px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:10px;
    height:100dvh;
    max-height:100dvh;
  }
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex:0 0 auto}
  h1{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    font-weight:400;
    font-size:clamp(22px,6.4vw,28px);
    letter-spacing:-.01em;
    line-height:1;
  }
  h1 small{display:block;margin-top:4px;font-family:"Segoe UI",sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
  .scores{display:flex;gap:6px}
  .score{
    min-width:64px;padding:6px 10px;text-align:center;
    background:#fbf6ea;border:1px solid var(--line);border-radius:8px;
    position:relative;
  }
  .score .lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
  .score .val{font-family:Georgia,serif;font-size:clamp(16px,4.6vw,20px);line-height:1.15;font-variant-numeric:tabular-nums}
  .float{
    position:absolute;left:50%;top:2px;transform:translateX(-50%);
    font-family:Georgia,serif;font-size:15px;color:var(--accent);
    pointer-events:none;animation:floatUp .7s ease-out forwards;
  }
  @keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-26px)}}

  .board-wrap{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0}
  #board{
    position:relative;
    width:min(100%, calc(100dvh - 210px), 92vw);
    aspect-ratio:1/1;
    background:linear-gradient(160deg,#e9dfc9,#e2d6bd);
    border:1px solid #d5c8ad;
    border-radius:14px;
    padding:0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 10px 26px -18px rgba(80,60,30,.55);
    touch-action:none;
    overflow:hidden;
  }
  .cells{position:absolute;inset:0}
  .cell{position:absolute;background:var(--cell);border-radius:var(--radius);box-shadow:inset 0 1px 0 rgba(255,255,255,.65)}
  .tiles{position:absolute;inset:0}
  .tile{
    position:absolute;left:0;top:0;
    display:flex;align-items:center;justify-content:center;
    border-radius:var(--radius);
    font-family:Georgia,"Times New Roman",serif;
    font-weight:400;
    color:#4a4030;
    background:#efe6d2;
    transform:translate3d(0,0,0);
    transition:transform .13s cubic-bezier(.22,.61,.36,1), background-color .18s ease, color .18s ease, box-shadow .2s ease;
    will-change:transform;
    backface-visibility:hidden;
  }
  .tile.pop{animation:pop .19s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(.55);opacity:.2}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
  .tile.merge{animation:merge .26s ease-out}
  @keyframes merge{0%{box-shadow:0 0 0 0 rgba(196,140,70,.55)}55%{box-shadow:0 0 0 10px rgba(196,140,70,0)}100%{box-shadow:0 0 0 0 rgba(196,140,70,0)}}
  .tile.hi{box-shadow:0 0 0 2px rgba(176,106,36,.55), 0 0 18px rgba(176,106,36,.35)}

  .v2{background:#efe7d4}
  .v4{background:#ece0c6}
  .v8{background:#e8c79a;color:#4a3520}
  .v16{background:#e3b078;color:#3f2a15}
  .v32{background:#dc9459;color:#fffaf1}
  .v64{background:#d07a3c;color:#fffaf1}
  .v128{background:#c76a2c;color:#fffaf1}
  .v256{background:#b95a22;color:#fffaf1}
  .v512{background:#a94b1a;color:#fff8ee}
  .v1024{background:#933f14;color:#fff6ea}
  .v2048{background:linear-gradient(150deg,#8c3a10,#b46a1e);color:#fff8ec;box-shadow:0 0 22px rgba(180,106,30,.45)}
  .v4096,.v8192{background:linear-gradient(150deg,#4c4a44,#6b6152);color:#fff8ec}

  footer{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hint{font-size:11.5px;color:var(--soft);line-height:1.35;max-width:62%}
  .btns{display:flex;gap:8px}
  button{
    font:inherit;font-size:13px;padding:9px 14px;border-radius:9px;
    border:1px solid #cdbf9f;background:#fbf6ea;color:#4a4132;
    cursor:pointer;touch-action:manipulation;
    box-shadow:0 1px 0 rgba(255,255,255,.7) inset;
  }
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff8ee}

  .overlay{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    background:rgba(244,238,225,.82);
    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);
    text-align:center;padding:18px;z-index:5;
  }
  .overlay.show{display:flex;animation:fade .2s ease-out}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay h2{margin:0;font-family:Georgia,serif;font-weight:400;font-size:clamp(20px,5.6vw,26px)}
  .overlay p{margin:0;color:var(--soft);font-size:13.5px;max-width:26ch}
  .badge{
    position:absolute;left:50%;top:14px;transform:translateX(-50%) translateY(-8px);
    background:#fff8ea;border:1px solid #dcbf8d;border-radius:999px;
    padding:7px 16px;font-family:Georgia,serif;font-size:15px;color:#8c5016;
    opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:4;
  }
  .badge.show{opacity:1;transform:translateX(-50%) translateY(0)}
  body.shake .board-wrap{animation:shake .3s}
  @keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  @media (max-height:640px){
    h1{font-size:20px}
    h1 small{display:none}
    .hint{font-size:10.5px}
    button{padding:7px 11px;font-size:12px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>2048<small>«МаТема» · игра</small></h1>
    <div class="scores">
      <div class="score" id="scoreBox"><div class="lbl">Очки</div><div class="val" id="score">0</div></div>
      <div class="score"><div class="lbl">Рекорд</div><div class="val" id="best">0</div></div>
    </div>
  </header>

  <div class="board-wrap">
    <div id="board">
      <div class="cells" id="cells"></div>
      <div class="tiles" id="tiles"></div>
      <div class="badge" id="badge">2048 — есть!</div>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">Ходов нет</h2>
        <p id="ovText">Поле заполнено, и сливать больше нечего.</p>
        <button class="primary" id="ovBtn" type="button">Ещё раз</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="hint">Свайп или стрелки. Одинаковые плитки сливаются; держите старшую в углу.</div>
    <div class="btns">
      <button type="button" id="undo">Отменить</button>
      <button class="primary" type="button" id="restart">Заново</button>
    </div>
  </footer>
</div>

<script id="t2048-core">
(function (root) {
  'use strict';

  var DIRS = {left: 'left', right: 'right', up: 'up', down: 'down'};

  function emptyGrid(n) {
    var g = [], r, c, row;
    for (r = 0; r < n; r++) { row = []; for (c = 0; c < n; c++) row.push(0); g.push(row); }
    return g;
  }

  function lineCoords(n, dir) {
    var lines = [], i, j, line;
    for (i = 0; i < n; i++) {
      line = [];
      for (j = 0; j < n; j++) {
        if (dir === 'left') line.push([i, j]);
        else if (dir === 'right') line.push([i, n - 1 - j]);
        else if (dir === 'up') line.push([j, i]);
        else line.push([n - 1 - j, i]);
      }
      lines.push(line);
    }
    return lines;
  }

  // Возвращает новую сетку, счёт и список перемещений для анимации.
  function moveGrid(grid, dir) {
    var n = grid.length;
    var next = emptyGrid(n);
    var moves = [];
    var gained = 0;

    lineCoords(n, dir).forEach(function (line) {
      var items = [], k, v, placements = [], i, a, b;
      for (k = 0; k < line.length; k++) {
        v = grid[line[k][0]][line[k][1]];
        if (v) items.push({ v: v, from: line[k] });
      }
      i = 0;
      while (i < items.length) {
        a = items[i];
        b = items[i + 1];
        if (b && a.v === b.v) {
          placements.push({ value: a.v * 2, from: [a.from, b.from], to: line[placements.length], merged: true });
          gained += a.v * 2;
          i += 2;
        } else {
          placements.push({ value: a.v, from: [a.from], to: line[placements.length], merged: false });
          i += 1;
        }
      }
      placements.forEach(function (p) {
        next[p.to[0]][p.to[1]] = p.value;
        moves.push(p);
      });
    });

    return { grid: next, gained: gained, moves: moves };
  }

  function canMove(grid) {
    var n = grid.length, r, c;
    for (r = 0; r < n; r++) for (c = 0; c < n; c++) {
      if (!grid[r][c]) return true;
      if (c + 1 < n && grid[r][c] === grid[r][c + 1]) return true;
      if (r + 1 < n && grid[r][c] === grid[r + 1][c]) return true;
    }
    return false;
  }

  function freeCells(grid) {
    var out = [], r, c;
    for (r = 0; r < grid.length; r++) for (c = 0; c < grid.length; c++) if (!grid[r][c]) out.push([r, c]);
    return out;
  }

  function spawn(grid, rnd) {
    var free = freeCells(grid);
    if (!free.length) return null;
    var pick = free[Math.floor((rnd || Math.random)() * free.length)];
    var value = (rnd || Math.random)() < 0.9 ? 2 : 4;
    grid[pick[0]][pick[1]] = value;
    return { r: pick[0], c: pick[1], value: value };
  }

  root.T2048 = {
    emptyGrid: emptyGrid,
    moveGrid: moveGrid,
    canMove: canMove,
    freeCells: freeCells,
    spawn: spawn,
    lineCoords: lineCoords,
    DIRS: DIRS
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
(function () {
  'use strict';
  var C = window.T2048;
  var N = 4;

  var boardEl = document.getElementById('board');
  var cellsEl = document.getElementById('cells');
  var tilesEl = document.getElementById('tiles');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var scoreBox = document.getElementById('scoreBox');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var ovBtn = document.getElementById('ovBtn');
  var badge = document.getElementById('badge');

  var state = {
    grid: C.emptyGrid(N),
    score: 0,
    best: 0,
    won: false,
    over: false,
    snapshot: null,
    tileEls: {}   // "r,c" -> element (актуальная сетка)
  };
  var geom = { size: 0, gap: 0, cell: 0 };

  function measure() {
    var w = boardEl.clientWidth;
    geom.size = w;
    geom.gap = w * 0.026;
    geom.cell = (w - geom.gap * (N + 1)) / N;
  }

  function pos(r, c) {
    return {
      x: geom.gap + c * (geom.cell + geom.gap),
      y: geom.gap + r * (geom.cell + geom.gap)
    };
  }

  function makeCells() {
    cellsEl.innerHTML = '';
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var p = pos(r, c);
      var d = document.createElement('div');
      d.className = 'cell';
      d.style.width = geom.cell + 'px';
      d.style.height = geom.cell + 'px';
      d.style.transform = 'translate3d(' + p.x + 'px,' + p.y + 'px,0)';
      cellsEl.appendChild(d);
    }
  }

  function tileFace(v, el) {
    el.textContent = v;
    el.className = 'tile';
    var cls = v <= 2048 ? 'v' + v : 'v4096';
    el.classList.add(cls);
    var len = String(v).length;
    var f = len <= 2 ? 0.44 : len === 3 ? 0.36 : 0.29;
    el.style.fontSize = Math.max(13, Math.round(geom.cell * f)) + 'px';
  }

  function place(el, r, c) {
    var p = pos(r, c);
    el.style.width = geom.cell + 'px';
    el.style.height = geom.cell + 'px';
    el.style.transform = 'translate3d(' + p.x + 'px,' + p.y + 'px,0)';
  }

  function eachTile(fn) {
    var key, parts;
    for (key in state.tileEls) {
      if (!Object.prototype.hasOwnProperty.call(state.tileEls, key)) continue;
      parts = key.split(',');
      fn(state.tileEls[key], +parts[0], +parts[1]);
    }
  }

  // Перекладывает существующие плитки на новые места и сливает по описанию moves.
  function applyMoves(moves) {
    var byFrom = {};
    moves.forEach(function (m) {
      m.from.forEach(function (f) { byFrom[f[0] + ',' + f[1]] = m; });
    });

    var nextEls = {};
    var used = {};

    eachTile(function (el, r, c) {
      var key = r + ',' + c;
      var m = byFrom[key];
      if (!m) return;
      place(el, m.to[0], m.to[1]);
      var toKey = m.to[0] + ',' + m.to[1];
      if (used[toKey]) {
        // вторая плитка в слиянии — уезжает в ту же клетку и растворяется
        el.style.zIndex = '1';
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 140);
        return;
      }
      used[toKey] = true;
      nextEls[toKey] = el;
      if (m.merged) {
        setTimeout(function () {
          tileFace(m.value, el);
          el.classList.add('merge');
          if (m.value >= 1024) el.classList.add('hi');
          setTimeout(function () { el.classList.remove('merge'); }, 280);
        }, 130);
      }
    });

    state.tileEls = nextEls;
  }

  function addTile(r, c, v, pop) {
    var el = document.createElement('div');
    el.className = 'tile';
    place(el, r, c);
    tileFace(v, el);
    if (v >= 1024) el.classList.add('hi');
    tilesEl.appendChild(el);
    if (pop) {
      el.style.transform += ' scale(.5)';
      requestAnimationFrame(function () {
        el.classList.add('pop');
        place(el, r, c);
      });
    }
    state.tileEls[r + ',' + c] = el;
  }

  function clearTiles() {
    tilesEl.innerHTML = '';
    state.tileEls = {};
  }

  function renderAll() {
    clearTiles();
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      if (state.grid[r][c]) addTile(r, c, state.grid[r][c], false);
    }
  }

  function floatScore(n) {
    if (!n) return;
    var s = document.createElement('span');
    s.className = 'float';
    s.textContent = '+' + n;
    scoreBox.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 720);
  }

  function updateScore(n) {
    state.score += n;
    scoreEl.textContent = state.score;
    if (state.score > state.best) {
      state.best = state.score;
      bestEl.textContent = state.best;
    }
  }

  function showBadge(text) {
    badge.textContent = text;
    badge.classList.add('show');
    setTimeout(function () { badge.classList.remove('show'); }, 1600);
  }

  function snapshot() {
    state.snapshot = { grid: state.grid.map(function (row) { return row.slice(); }), score: state.score };
  }

  function newGame() {
    state.grid = C.emptyGrid(N);
    state.score = 0;
    state.won = false;
    state.over = false;
    state.snapshot = null;
    scoreEl.textContent = '0';
    bestEl.textContent = String(state.best);
    overlay.classList.remove('show');
    clearTiles();
    C.spawn(state.grid);
    C.spawn(state.grid);
    renderAll();
  }

  function bump() {
    document.body.classList.add('shake');
    setTimeout(function () { document.body.classList.remove('shake'); }, 320);
  }

  function move(dir) {
    if (state.over) return;
    var res = C.moveGrid(state.grid, dir);
    var changed = false;
    for (var r = 0; r < N && !changed; r++) for (var c = 0; c < N; c++) {
      if (res.grid[r][c] !== state.grid[r][c]) { changed = true; break; }
    }
    if (!changed) { bump(); return; }

    snapshot();
    state.grid = res.grid;
    applyMoves(res.moves);
    updateScore(res.gained);
    floatScore(res.gained);

    setTimeout(function () {
      var sp = C.spawn(state.grid);
      if (sp) addTile(sp.r, sp.c, sp.value, true);

      var has2048 = false;
      for (var rr = 0; rr < N; rr++) for (var cc = 0; cc < N; cc++) if (state.grid[rr][cc] >= 2048) has2048 = true;
      if (has2048 && !state.won) {
        state.won = true;
        showBadge('2048 — есть! Можно дальше');
      }

      if (!C.canMove(state.grid)) {
        state.over = true;
        ovTitle.textContent = 'Ходов нет';
        ovText.textContent = 'Поле заполнено. Ваш результат — ' + state.score + ' очков.';
        setTimeout(function () { overlay.classList.add('show'); }, 260);
      }
    }, 150);
  }

  function undo() {
    if (!state.snapshot) return;
    state.grid = state.snapshot.grid.map(function (row) { return row.slice(); });
    state.score = state.snapshot.score;
    scoreEl.textContent = state.score;
    state.over = false;
    overlay.classList.remove('show');
    renderAll();
    state.snapshot = null;
  }

  // ---- ввод ----
  var start = null;
  boardEl.addEventListener('pointerdown', function (e) {
    start = { x: e.clientX, y: e.clientY };
  }, { passive: true });
  boardEl.addEventListener('pointerup', function (e) {
    if (!start) return;
    var dx = e.clientX - start.x;
    var dy = e.clientY - start.y;
    start = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
    else move(dy > 0 ? 'down' : 'up');
  }, { passive: true });
  boardEl.addEventListener('pointercancel', function () { start = null; }, { passive: true });

  document.addEventListener('keydown', function (e) {
    var map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' };
    var dir = map[e.key] || map[e.key.toLowerCase()];
    if (!dir) return;
    e.preventDefault();
    move(dir);
  });

  document.getElementById('restart').addEventListener('click', newGame);
  document.getElementById('undo').addEventListener('click', undo);
  ovBtn.addEventListener('click', newGame);

  var rt = null;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      measure();
      makeCells();
      renderAll();
    }, 120);
  });

  measure();
  makeCells();
  newGame();
})();
</script>
</body>
</html>
